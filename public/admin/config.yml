backend:
  name: github
  repo: rev3esed/abbou_tahar-port
  branch: main

# Upload location for new PDFs, slides, and images
media_folder: "public/uploads"
public_folder: "/uploads"

locale: "en"

collections:
  # -------------------------------------------------------------
  # 1. PROFILE & BIO
  # -------------------------------------------------------------
  - name: "profile"
    label: "Profile & Bio"
    files:
      - file: "src/data/profile.json"
        label: "About Prof. Tahar Abbou"
        name: "about"
        fields:
          - { label: "Full Name", name: "name", widget: "string" }
          - { label: "Arabic Name", name: "name_ar", widget: "string", required: false }
          - { label: "Academic Title", name: "title", widget: "string" }
          - { label: "Affiliation", name: "affiliation", widget: "string" }
          - { label: "Profile Portrait Photo", name: "portrait_image", widget: "image" }
          - { label: "Curriculum Vitae (PDF)", name: "cv_pdf", widget: "file" }
          - { label: "Primary Academic Email", name: "email", widget: "string" }
          - { label: "Secondary Email", name: "secondary_email", widget: "string", required: false }
          - { label: "WhatsApp Contact Numbers", name: "whatsapp", widget: "list" }
          - { label: "Office Address", name: "address", widget: "string" }
          - { label: "Academic Biography", name: "bio", widget: "text" }
          - { label: "Research Interests", name: "research_interests", widget: "list" }
          - { label: "Languages", name: "languages", widget: "list" }

  # -------------------------------------------------------------
  # 2. PUBLICATIONS (FOLDER COLLECTION - INDIVIDUAL PAPERS)
  # -------------------------------------------------------------
  - name: "publications"
    label: "Publications"
    label_singular: "Publication"
    folder: "src/content/publications"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} ({{year}})"
    sortable_fields: ["year", "title"]
    view_filters:
      - label: "Recent (2020+)"
        field: "year"
        pattern: "202[0-9]"
    fields:
      - { label: "Publication Title", name: "title", widget: "string" }
      - { label: "Publication Year", name: "year", widget: "number", value_type: "int" }
      - { label: "External Link / DOI / ASJP", name: "url", widget: "string", required: false }
      - { label: "Authors", name: "authors", widget: "string", default: "Prof. Dr. Tahar Abbou" }
      - { label: "Featured on Homepage?", name: "featured", widget: "boolean", default: false, required: false }
      - { label: "Full Citation & Abstract", name: "body", widget: "markdown" }

  # -------------------------------------------------------------
  # 3. COURSES & TEACHING (FOLDER COLLECTION)
  # -------------------------------------------------------------
  - name: "courses"
    label: "Courses & Teaching"
    label_singular: "Course"
    folder: "src/content/courses"
    create: true
    slug: "{{slug}}"
    summary: "{{code}}: {{title}} ({{level}})"
    fields:
      - { label: "Course Code", name: "code", widget: "string" }
      - { label: "Course Title", name: "title", widget: "string" }
      - { label: "Academic Level", name: "level", widget: "string" }
      - { label: "Semester", name: "semester", widget: "string" }
      - { label: "Period / Academic Year", name: "period", widget: "string" }
      - { label: "Department", name: "department", widget: "string" }
      - { label: "Course Description & Objectives", name: "description", widget: "text" }
      - label: "Downloadable Exams, Tests & Lecture Notes"
        name: "resources"
        widget: "list"
        required: false
        fields:
          - { label: "File Title / Label", name: "title", widget: "string" }
          - { label: "File (PDF/PPT/DOC)", name: "file", widget: "file" }
          - { label: "Format", name: "format", widget: "string", default: "PDF" }
          - { label: "Type", name: "type", widget: "string", default: "Exam Preparation" }

  # -------------------------------------------------------------
  # 4. CONFERENCES (FOLDER COLLECTION)
  # -------------------------------------------------------------
  - name: "conferences"
    label: "Conferences"
    label_singular: "Conference"
    folder: "src/content/conferences"
    create: true
    slug: "{{slug}}"
    summary: "{{year}}: {{title}}"
    sortable_fields: ["year"]
    fields:
      - { label: "Paper / Conference Title", name: "title", widget: "string" }
      - { label: "Year", name: "year", widget: "number", value_type: "int" }
      - label: "Scope"
        name: "scope"
        widget: "select"
        options:
          - { label: "National (Algeria)", value: "national" }
          - { label: "International (Abroad)", value: "international" }
        default: "national"
      - { label: "Location / Country", name: "location", widget: "string", required: false }
      - { label: "Conference Details & Abstract", name: "body", widget: "markdown" }

  # -------------------------------------------------------------
  # 5. PHOTO GALLERY (FOLDER COLLECTION)
  # -------------------------------------------------------------
  - name: "gallery"
    label: "Photo Gallery"
    label_singular: "Photo"
    folder: "src/content/gallery"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} - {{event}}"
    fields:
      - { label: "Photo Image", name: "image", widget: "image" }
      - { label: "Photo Title", name: "title", widget: "string" }
      - { label: "Academic Event / Occasion", name: "event", widget: "string" }
      - { label: "Caption / Description", name: "caption", widget: "string" }

  # -------------------------------------------------------------
  # 6. USEFUL LINKS (FOLDER COLLECTION)
  # -------------------------------------------------------------
  - name: "links"
    label: "Useful Links"
    label_singular: "Link"
    folder: "src/content/links"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} ({{category}})"
    fields:
      - { label: "Resource Title", name: "title", widget: "string" }
      - { label: "Website URL", name: "url", widget: "string" }
      - { label: "Category", name: "category", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }

  # -------------------------------------------------------------
  # 7. SCIENTIFIC ACTIVITIES
  # -------------------------------------------------------------
  - name: "activities"
    label: "Scientific Activities"
    files:
      - file: "src/data/activities.json"
        label: "Research Projects & PRFU Teams"
        name: "act_data"
        fields:
          - label: "Categories"
            name: "categories"
            widget: "list"
            fields:
              - { label: "Category Name", name: "category", widget: "string" }
              - label: "Projects & Tasks"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Role", name: "role", widget: "string" }
                  - { label: "Institution / Director", name: "institution", widget: "string", required: false }
                  - { label: "URL", name: "url", widget: "string", required: false }
