backend:
  name: github
  repo: rev3esed/abbou_tahar-port
  branch: main

# Where uploaded files (PDFs, PPTs, images) are stored in the repository
media_folder: "public/uploads"
# How files are referenced in the HTML
public_folder: "/uploads"

locale: "en"

collections:
  # -------------------------------------------------------------
  # 1. PROFILE & BIO SETTINGS
  # -------------------------------------------------------------
  - name: "profile"
    label: "Profile & Bio"
    files:
      - file: "src/data/profile.json"
        label: "About Prof. Tahar Abbou"
        name: "about"
        fields:
          - { label: "Full Name", name: "name", widget: "string" }
          - { label: "Academic Title", name: "title", widget: "string" }
          - { label: "Affiliation", name: "affiliation", widget: "string" }
          - { label: "Profile Portrait Photo", name: "portrait_image", widget: "image" }
          - { label: "Curriculum Vitae (PDF)", name: "cv_pdf", widget: "file" }
          - { label: "Primary Email", name: "email", widget: "string" }
          - { label: "Secondary Email", name: "secondary_email", widget: "string", required: false }
          - { label: "WhatsApp Contacts", name: "whatsapp", widget: "list" }
          - { label: "Office Location", name: "address", widget: "string" }
          - { label: "Biography", name: "bio", widget: "text" }
          - { label: "Research Interests", name: "research_interests", widget: "list" }
          - { label: "Languages", name: "languages", widget: "list" }

  # -------------------------------------------------------------
  # 2. PUBLICATIONS
  # -------------------------------------------------------------
  - name: "publications"
    label: "Publications"
    files:
      - file: "src/data/publications.json"
        label: "Publications Bibliography"
        name: "pub_list"
        fields:
          - label: "Articles, Books & Chapters"
            name: "items"
            widget: "list"
            fields:
              - { label: "Number / ID", name: "id", widget: "number" }
              - { label: "Citation & Details", name: "raw", widget: "text" }
              - { label: "External Link / DOI / ASJP", name: "url", widget: "string", required: false }

  # -------------------------------------------------------------
  # 3. COURSES & TEACHING
  # -------------------------------------------------------------
  - name: "courses"
    label: "Courses & Teaching"
    files:
      - file: "src/data/courses.json"
        label: "Teaching Courses & Materials"
        name: "course_list"
        fields:
          - label: "Courses"
            name: "items"
            widget: "list"
            fields:
              - { label: "Course Code", name: "code", widget: "string" }
              - { label: "Course Title", name: "title", widget: "string" }
              - { label: "Academic Level", name: "level", widget: "string" }
              - { label: "Semester", name: "semester", widget: "string" }
              - { label: "Period", name: "period", widget: "string" }
              - { label: "Department", name: "department", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - label: "Downloadable Files & Exams"
                name: "resources"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "File (PDF/PPT)", name: "file", widget: "file" }
                  - { label: "Format", name: "format", widget: "string", default: "PDF" }
                  - { label: "Type", name: "type", widget: "string", default: "Exam Preparation" }

  # -------------------------------------------------------------
  # 4. CONFERENCES
  # -------------------------------------------------------------
  - name: "conferences"
    label: "Conferences"
    files:
      - file: "src/data/conferences.json"
        label: "Conference Presentations"
        name: "conf_list"
        fields:
          - label: "Conferences List"
            name: "items"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "number" }
              - { label: "Paper & Conference Title", name: "title", widget: "text" }
              - { label: "Year", name: "year", widget: "number" }

  # -------------------------------------------------------------
  # 5. SCIENTIFIC ACTIVITIES
  # -------------------------------------------------------------
  - name: "activities"
    label: "Scientific Activities"
    files:
      - file: "src/data/activities.json"
        label: "Research Projects & Councils"
        name: "act_list"
        fields:
          - label: "Activity Categories"
            name: "items"
            widget: "list"
            fields:
              - { label: "Category Name", name: "category", widget: "string" }
              - label: "Projects & Tasks"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Role", name: "role", widget: "string" }
                  - { label: "Institution / Director", name: "institution", widget: "string", required: false }
                  - { label: "URL", name: "url", widget: "string", required: false }

  # -------------------------------------------------------------
  # 6. PHOTO GALLERY
  # -------------------------------------------------------------
  - name: "gallery"
    label: "Photo Gallery"
    files:
      - file: "src/data/gallery.json"
        label: "Photos"
        name: "gallery_list"
        fields:
          - label: "Gallery Photos"
            name: "items"
            widget: "list"
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Event", name: "event", widget: "string" }
              - { label: "Caption", name: "caption", widget: "string" }

  # -------------------------------------------------------------
  # 7. USEFUL LINKS
  # -------------------------------------------------------------
  - name: "links"
    label: "Useful Links"
    files:
      - file: "src/data/links.json"
        label: "Academic Links"
        name: "links_list"
        fields:
          - label: "Links"
            name: "items"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
              - { label: "Category", name: "category", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
